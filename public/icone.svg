<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arquivo Morto EE Profa. Marlene Frattini">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="destaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#fundo)"/>
  <circle cx="96" cy="96" r="150" fill="#34d399" opacity="0.16"/>
  <circle cx="430" cy="430" r="170" fill="#22d3ee" opacity="0.12"/>

  <!-- caixa de arquivo -->
  <g>
    <rect x="164" y="150" width="184" height="34" rx="10" fill="url(#destaque)"/>
    <rect x="140" y="186" width="232" height="176" rx="22" fill="#f0fdfa" opacity="0.96"/>
    <rect x="140" y="186" width="232" height="176" rx="22" fill="none" stroke="#99f6e4" stroke-width="6"/>
    <rect x="216" y="244" width="80" height="16" rx="8" fill="#0f766e"/>
  </g>

  <!-- monograma EE -->
  <text x="256" y="430" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="132" font-weight="700" text-anchor="middle" fill="#f0fdfa">EE</text>
  <rect x="150" y="452" width="212" height="10" rx="5" fill="url(#destaque)"/>
</svg>
